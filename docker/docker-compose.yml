# Definition of the development container. Driven by ./dock.sh, which supplies
# CONTAINER_NAME and USER_UID/USER_GID.
#
# The container talks to the camera over USB, so it needs the host's devices.
# It shares the host's network, so that it discovers the ROS2 nodes running on
# the host or in other containers with the same DDS settings (see
# cyclonedds.xml).

services:
  dev:
    build:
      context: .
      args:
        # A uid/gid matching the host user keeps the bind-mounted workspace
        # writable and correctly owned on the host.
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ${CONTAINER_NAME:-stepit-camera}:latest
    container_name: ${CONTAINER_NAME:-stepit-camera}
    hostname: ${CONTAINER_NAME:-stepit-camera}
    # libgphoto2 opens the camera through /dev/bus/usb. Mounting the whole of
    # /dev, rather than the one device, lets the camera be unplugged and
    # plugged in again while the container runs: it comes back under a new
    # device number.
    privileged: true
    # Required for DDS discovery with the ROS2 nodes outside this container.
    network_mode: host
    volumes:
      # Relative paths resolve against this file's directory, so this is the
      # repo root whatever machine it is checked out on. The pictures
      # downloaded from the camera land in its `pictures` folder.
      - ..:/home/developer/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /dev:/dev
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: 1
    # Keep the container alive so shells can be attached to it on demand.
    command: sleep infinity
